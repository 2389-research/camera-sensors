# ABOUTME: Has Dependabot propose weekly updates for the uv lockfile, the actions the
# ABOUTME: workflows use, and the Dockerfile's base images.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
