[project]
name = "djev-sensors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
filterwarnings = ["error"]
