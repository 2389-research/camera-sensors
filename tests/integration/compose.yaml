# ABOUTME: Isolated integration-test stack: MediaMTX serves RTSP over TCP and Mosquitto
# ABOUTME: serves MQTT, each published on 127.0.0.1 only. Started by tests/integration.
name: camera-sensors-test

services:
  mediamtx:
    image: bluenviron/mediamtx:1
    environment:
      # Only TCP crosses Docker Desktop's port forwarding, so disable RTSP over UDP.
      MTX_RTSPTRANSPORTS: tcp
    ports:
      - "127.0.0.1:18554:8554"

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:18883:1883"
